name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.6`).
#
# Pipeline:
#   tauri-action builds the Windows bundle, signs the .msi / -setup.exe
#   with the updater private key, emits `latest.json`, and publishes
#   everything as a GitHub release on this repo. The Tauri auto-updater
#   pulls `latest.json` directly from this repo's releases endpoint.
#
# History note: this used to mirror to a sibling public repo
# (`IP-Mattos/claude-startup-kit-releases`) because the source was
# private and private-repo release assets aren't downloadable without
# auth. The source went public in v0.1.36, so the mirror is no longer
# needed and the second step was removed in v0.1.38. The mirror repo
# is kept alive for backward compatibility with already-installed
# clients pinned at the old endpoint; new bundles ship from this repo.
#
# Required secrets:
#   - TAURI_SIGNING_PRIVATE_KEY           (private key file content)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (passphrase from key gen)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build, sign & publish Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Build the claudewatch TUI binary so tauri-action can bundle it as a
      # resource (tauri.conf.json -> bundle.resources). The .exe is gitignored
      # under src-tauri/resources/claudewatch/, so it must be produced here at
      # release time. Go version must satisfy tools/claudewatch/go.mod's `go`
      # directive (1.26.1 at time of writing); 'stable' tracks the latest.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build claudewatch TUI
        run: go build -ldflags "-s -w" -o src-tauri/resources/claudewatch/claudewatch.exe ./tools/claudewatch

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Reuse the tag that triggered the workflow.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See `CHANGELOG.md` in the repo for the full notes for this release.
          releaseDraft: false
          prerelease: false
          # Generates `latest.json` (the manifest the in-app updater reads) and
          # uploads it alongside the .msi / -setup.exe.
          includeUpdaterJson: true
