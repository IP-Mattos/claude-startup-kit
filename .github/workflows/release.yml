name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.2`).
#
# Builds the Windows bundle with `tauri-apps/tauri-action`, which also:
#   - signs the .msi/-setup.exe with the updater private key (env vars below),
#   - emits the `latest.json` manifest the in-app updater pulls from
#     `releases/latest/download/latest.json`,
#   - uploads everything as release assets in one step.
#
# To make this run end-to-end, the repo needs two GitHub Actions secrets:
#   - TAURI_SIGNING_PRIVATE_KEY           (full content of the private key file)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (the passphrase chosen at key gen)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build, sign & publish Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Reuse the tag that triggered the workflow.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See `CHANGELOG.md` in the repo for the full notes for this release.
          releaseDraft: false
          prerelease: false
          # Generates `latest.json` (the manifest the in-app updater reads) and
          # uploads it alongside the .msi / -setup.exe. Without this, signed
          # bundles still publish but the updater plugin has nothing to read.
          includeUpdaterJson: true
