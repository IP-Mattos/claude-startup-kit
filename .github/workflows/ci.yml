name: CI

on:
  push:
    branches: [main, desktopapp]
  pull_request:
    branches: [main, desktopapp]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  legacy-validate:
    name: Legacy PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax (legacy/**/*.ps1)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path legacy -Recurse -Include *.ps1 -File -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "No legacy .ps1 files found"; exit 0 }
          $failed = @()
          foreach ($f in $files) {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $f.FullName
              Write-Host "::error file=$($f.FullName)::Parse error in $($f.Name)"
              foreach ($e in $errors) { Write-Host "  - line $($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "OK  $($f.FullName)"
            }
          }
          if ($failed.Count -gt 0) { exit 1 }
