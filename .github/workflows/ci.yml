name: CI

on:
  push:
    branches: [main, desktopapp]
  pull_request:
    branches: [main, desktopapp]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  go:
    name: Go build & test (claudewatch)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirror release.yml: 'stable' tracks the latest Go release, which must
      # satisfy tools/claudewatch/go.mod's `go` directive (1.26.1 at time of
      # writing). The module lives in tools/claudewatch (the repo root is NOT
      # a Go module), so caching keys off that go.sum.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: tools/claudewatch/go.sum

      - name: go build
        working-directory: tools/claudewatch
        run: go build ./...

      - name: go test
        working-directory: tools/claudewatch
        run: go test ./...

  legacy-validate:
    name: Legacy PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax (legacy/**/*.ps1)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path legacy -Recurse -Include *.ps1 -File -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "No legacy .ps1 files found"; exit 0 }
          $failed = @()
          foreach ($f in $files) {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $f.FullName
              Write-Host "::error file=$($f.FullName)::Parse error in $($f.Name)"
              foreach ($e in $errors) { Write-Host "  - line $($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "OK  $($f.FullName)"
            }
          }
          if ($failed.Count -gt 0) { exit 1 }
