[package]
name = "app"
version = "0.1.53"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Real auto-updater: downloads + verifies signature + atomic install + restart.
# Requires TAURI_SIGNING_PRIVATE_KEY{,_PASSWORD} at build time and a `latest.json`
# manifest published alongside the release artifacts.
tauri-plugin-updater = "2"
# Launch on system boot. Persists to HKCU\Software\Microsoft\Windows\CurrentVersion\Run
# on Windows. The toggle lives in Settings — disabled by default, user opts in.
tauri-plugin-autostart = "2"
# Native folder/file pickers (so the user picks a clone target dir from a real
# Explorer window instead of typing the path by hand).
tauri-plugin-dialog = "2"
# Update channel — uses the GitHub releases REST API so no signing infra is
# required. See lib.rs `check_*_update` commands.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
once_cell = "1"

